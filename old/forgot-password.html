<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIT LIFE.GYM - Recuperar contraseña</title>

    <link rel="stylesheet" href="./assets/css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="./assets/js/ui.js" defer></script>
    <script src="./assets/js/api.js" defer></script>
    <script src="./assets/js/recuperar.js" defer></script>
</head>
<body>
    <section class="fondo">
        <div class="contenedor">
            <div class="card">
                <header class="card-header">
                    <h2>Recuperar contraseña</h2>
                </header>

                <div class="card-body">
                    <p style="text-align:center">
                        Ingresa tu correo y te enviaremos un enlace para crear una nueva contraseña.
                    </p>

                    <div id="mensaje" class="validation-message"
                         role="status" aria-live="polite"></div>

                    <form id="formRecuperar">
                        <div class="input-group">
                            <input type="email" id="correo" name="correo"
                                   placeholder="Correo electrónico"
                                   autocomplete="email" required>
                        </div>

                        <button class="btn" type="submit">ENVIAR ENLACE</button>

                        <a class="btn-secundario" href="./index.html">
                            <i class="fa-solid fa-arrow-left"></i>
                            Volver al inicio de sesión
                        </a>
                    </form>
                </div>

                <footer class="card-footer">
                    <p>¿No tienes cuenta? <a href="./registro.html">¡Regístrate!</a></p>
                </footer>
            </div>
        </div>
    </section>
</body>
</html>
