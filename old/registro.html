<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIT LIFE.GYM - Registro</title>

    <link rel="stylesheet" href="./assets/css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="./assets/js/ui.js" defer></script>
    <script src="./assets/js/api.js" defer></script>
    <script src="./assets/js/registro.js" defer></script>
</head>
<body>
    <section class="fondo">
        <div class="contenedor">
            <div class="card">
                <header class="card-header">
                    <h2>Crear cuenta</h2>
                </header>

                <div class="card-body">
                    <form id="formRegistro">
                        <div id="validation-message" class="validation-message"
                             role="status" aria-live="polite"></div>

                        <div class="input-box">
                            <input type="text" id="nombre" name="nombre"
                                   placeholder="Nombre completo"
                                   autocomplete="name" minlength="2" required>
                        </div>

                        <div class="input-box">
                            <input type="text" id="pais" name="pais"
                                   placeholder="País"
                                   autocomplete="country-name" required>
                        </div>

                        <div class="input-box">
                            <input type="text" id="ciudad" name="ciudad"
                                   placeholder="Ciudad"
                                   autocomplete="address-level2" required>
                        </div>

                        <div class="input-box">
                            <input type="tel" id="telefono" name="telefono"
                                   placeholder="Teléfono (+57...)"
                                   autocomplete="tel"
                                   pattern="\+?[0-9\s\(\)\-]{7,20}"
                                   title="Introduce un teléfono válido."
                                   required>
                        </div>

                        <div class="input-box">
                            <input type="email" id="correo" name="correo"
                                   placeholder="Correo electrónico"
                                   autocomplete="email" required>
                        </div>

                        <div class="password-container">
                            <div class="input-group">
                                <input type="password" id="password" name="password"
                                       placeholder="Contraseña"
                                       autocomplete="new-password" minlength="8"
                                       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                                       title="Usa al menos 8 caracteres, una mayúscula, una minúscula y un número."
                                       required>
                            </div>
                            <button type="button" class="password-toggle"
                                    data-label="contraseña" aria-label="Mostrar contraseña">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>

                        <div class="password-container">
                            <div class="input-group">
                                <input type="password" id="confirmarPassword" name="confirmarPassword"
                                       placeholder="Confirmar contraseña"
                                       autocomplete="new-password" required>
                            </div>
                            <button type="button" class="password-toggle"
                                    data-label="confirmación de contraseña"
                                    aria-label="Mostrar confirmación de contraseña">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>

                        <button class="btn" type="submit">REGISTRARSE</button>
                    </form>
                </div>

                <footer class="card-footer">
                    <p>¿Ya tienes una cuenta? <a href="./index.html">Inicia sesión</a></p>
                </footer>
            </div>
        </div>
    </section>
</body>
</html>
